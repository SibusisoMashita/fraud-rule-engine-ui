name: fraud-rule-engine-ui
services:
  ui:
    image: ${UI_IMAGE:-fraud-rule-engine-ui:local}
    build: .
    init: true
    user: nginx
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 10s
    ports: ['127.0.0.1:${UI_PORT:-3000}:8080']
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-app:8080}
    networks: [backend]
networks:
  backend:
    external: true
    name: ${BACKEND_NETWORK:-fraud-rule-engine-service_default}
